name: Update README with NYT News

on:
  schedule:
    - cron: '*/5 0 * * *'
  push:
    branches: [ "main" ]
  workflow_dispatch:      

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write    # 파일 쓰기 권한 필수
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run update script
        env:
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }} # GitHub Secrets에 저장한 이름
        run: python update_weather.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: update NYT popular articles" || echo "No changes to commit"
          git push
